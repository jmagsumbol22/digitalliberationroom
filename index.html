<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Digital Liberation Room</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
</head>
<body>

  <canvas id="matrix-rain"></canvas>

  <!-- PAGE 1 -->
  <div class="page active" id="page-1">
    <div class="terminal-box">
      <h1 class="page-header">Digital Liberation Room</h1>
      <p class="body-text">Do you want to make it in America?</p>
      <div class="btn-group">
        <button class="matrix-btn" onclick="goTo('page-2')">YES</button>
        <button class="matrix-btn" onclick="goTo('page-1a')">NO</button>
      </div>
    </div>
  </div>

  <!-- PAGE 1A -->
  <div class="page" id="page-1a">
    <div class="terminal-box">
      <h1 class="page-header">Digital Liberation Room</h1>
      <p class="body-text">Sorry, you must want to make it in America.</p>
      <div class="btn-group">
        <button class="matrix-btn" onclick="goTo('page-2')">OK</button>
      </div>
    </div>
  </div>

  <!-- PAGE 2 (placeholder) -->
  <div class="page" id="page-2">
    <div class="terminal-box">
      <h1 class="page-header">Header</h1>
      <p class="body-text">Placeholder</p>
      <div class="btn-group">
        <button class="matrix-btn" onclick="goTo('page-1')">Placeholder</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
